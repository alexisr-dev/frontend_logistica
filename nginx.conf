server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los ficheros de /assets llevan hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea para que un despliegue nuevo se vea al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: la app usa BrowserRouter, así que /pedidos etc. deben devolver index.html.
    location / {
        try_files $uri /index.html;
    }
}
